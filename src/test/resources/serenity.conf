serenity {
  project.name = "PetStay - Pruebas Front-End"
  test.root = features
  requirements.dir = features
  requirements.base.dir = src/test/resources
  outputDirectory = target/site/serenity
  report.encoding = UTF8
  take.screenshots = FOR_EACH_ACTION
  # Cada escenario arranca con un navegador limpio (la app guarda todo en localStorage)
  restart.browser.for.each = scenario
  # Los tags @issue:N se convierten en enlaces al issue de GitHub dentro del reporte
  issue.tracker.url = "https://github.com/criskian/petstay-serenity-bdd/issues/{0}"
  browser = chrome
}

# URL de la aplicación bajo prueba (se puede sobrescribir con -Dpetstay.base.url=...)
petstay.base.url = "https://petstay-aphn.onrender.com"

webdriver.timeouts.implicitlywait = 15000
# Render (plan gratuito) puede "dormir" el servicio: se deja margen para el primer arranque
webdriver.timeouts.pageload = 90000

# En local se ve el navegador; en CI se activa con -Dheadless.mode=true
headless.mode = false

environments {
  chrome {
    webdriver {
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["--start-maximized", "--window-size=1366,900", "--no-sandbox", "--disable-dev-shm-usage",
                  "--disable-popup-blocking", "--disable-infobars", "--disable-notifications",
                  "--remote-allow-origins=*", "--ignore-certificate-errors"]
        }
      }
    }
  }
  edge {
    webdriver {
      driver = "edge"
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          args = ["--start-maximized", "--window-size=1366,900", "--disable-popup-blocking", "--disable-infobars"]
        }
      }
    }
  }
  firefox {
    webdriver {
      driver = "firefox"
      capabilities {
        browserName = "firefox"
        pageLoadStrategy = "normal"
        acceptInsecureCerts = true
        unhandledPromptBehavior = "dismiss"
        "moz:firefoxOptions" {
          args = ["-width=1366", "-height=900"]
        }
      }
    }
  }
}

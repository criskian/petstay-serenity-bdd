name: Pruebas Front-End (Serenity BDD)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Filtro de tags de Cucumber (ej: @smoke, @HU-03, @issue:12, @negativo). Vacío = todos los escenarios'
        required: false
        default: ''

# Permisos mínimos: leer el código y publicar el reporte en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita ejecuciones simultáneas que se pisen al publicar el reporte
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Ejecutar escenarios en Chrome headless
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Despertar la aplicación (Render duerme el servicio gratuito)
        run: curl --silent --show-error --retry 8 --retry-delay 10 --retry-all-errors --max-time 90 --output /dev/null https://petstay-aphn.onrender.com/index.html

      # El escenario marcado @defecto-conocido describe el comportamiento CORRECTO de una función que hoy
      # está rota en la aplicación (issue #32), así que falla a propósito. Se excluye de la ejecución
      # principal para que un rojo signifique "se rompió algo nuevo", y se ejecuta aparte como evidencia.
      - name: Ejecutar pruebas
        env:
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          chmod +x gradlew
          if [ -z "$TAGS" ]; then TAGS="not @defecto-conocido"; fi
          ./gradlew clean test --console=plain -Dheadless.mode=true -Dcucumber.filter.tags="$TAGS"

      - name: Evidencia del defecto conocido (issue #32, no bloquea el pipeline)
        if: always() && github.event.inputs.tags == ''
        continue-on-error: true
        run: ./gradlew test --console=plain -Dheadless.mode=true -Dcucumber.filter.tags="@defecto-conocido"

      - name: Resumen de resultados
        if: always()
        run: |
          {
            echo "## Resultados Serenity BDD"
            echo
            if [ -f target/site/serenity/summary.txt ]; then
              echo '```'
              cat target/site/serenity/summary.txt
              echo '```'
            else
              echo "No se generó el resumen de Serenity."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reporte de Serenity como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-serenity
          path: target/site/serenity
          retention-days: 30

      - name: Preparar reporte para GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/serenity

      - name: Publicar reporte en GitHub Pages
        id: despliegue
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
